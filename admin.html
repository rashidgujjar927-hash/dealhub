<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - DealHub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #171d35,
                    #4d42c8
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* ================= LOGIN CARD ================= */

        .login-card {

            width: 100%;
            max-width: 420px;

            background: #ffffff;

            border-radius: 20px;

            padding: 38px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.25);
        }


        /* ================= LOGO ================= */

        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 900;

            color: #172033;

            margin-bottom: 5px;
        }

        .logo span {
            color: #635bff;
        }


        .admin-label {

            text-align: center;

            font-size: 11px;

            letter-spacing: 2px;

            font-weight: 800;

            color: #7b8498;

            margin-bottom: 30px;
        }


        /* ================= HEADING ================= */

        h1 {

            text-align: center;

            margin: 0 0 8px;

            font-size: 26px;

            color: #172033;
        }


        .subtitle {

            text-align: center;

            color: #7a8499;

            font-size: 14px;

            margin-bottom: 28px;
        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            font-size: 13px;

            font-weight: 700;

            color: #424b5f;

            margin-bottom: 7px;
        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #dce0e9;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }


        input:focus {

            border-color: #635bff;

            box-shadow:
                0 0 0 3px
                rgba(99, 91, 255, 0.10);
        }


        /* ================= PASSWORD ================= */

        .password-box {

            position: relative;
        }


        .password-box input {

            padding-right: 75px;
        }


        .show-password {

            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            border: 0;

            background: transparent;

            color: #635bff;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;
        }


        /* ================= BUTTON ================= */

        .login-btn {

            width: 100%;

            border: 0;

            border-radius: 10px;

            padding: 14px;

            background: #635bff;

            color: #ffffff;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.2s;
        }


        .login-btn:hover {

            background: #5148e8;

            transform: translateY(-1px);
        }


        /* ================= ERROR ================= */

        .error {

            display: none;

            background: #fff0f0;

            color: #c52222;

            border: 1px solid #ffd2d2;

            border-radius: 9px;

            padding: 11px;

            font-size: 13px;

            margin-bottom: 15px;

            text-align: center;
        }


        .error.show {

            display: block;
        }


        /* ================= BACK ================= */

        .back-home {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #7a8499;

            font-size: 13px;

            text-decoration: none;
        }


        .back-home:hover {

            color: #635bff;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 480px) {

            .login-card {

                padding: 28px 22px;
            }

        }

    </style>

</head>


<body>


    <div class="login-card">


        <!-- LOGO -->

        <div class="logo">
            Deal<span>Hub</span>
        </div>


        <div class="admin-label">
            ADMIN PANEL
        </div>


        <h1>
            Welcome Back
        </h1>


        <p class="subtitle">
            Login to manage your stores, coupons and categories.
        </p>


        <!-- ERROR MESSAGE -->

        <div
            id="errorMessage"
            class="error"
        >
            Invalid username or password.
        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Admin ID
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter admin ID"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
            >
                Login to Admin
            </button>


        </form>


        <!-- BACK -->

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Website
        </a>


    </div>


    <script>

        /*
        ==========================================
        ADMIN LOGIN DETAILS
        ==========================================

        Default:

        ID       = admin
        Password = admin123

        Agar credentials change karne hon to
        sirf neeche dono values change karein.
        ==========================================
        */

        const ADMIN_ID = "admin";

        const ADMIN_PASSWORD = "admin123";


        /*
        ==========================================
        LOGIN
        ==========================================
        */

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const error =
                    document
                        .getElementById("errorMessage");


                /*
                Check credentials
                */

                if (
                    username === ADMIN_ID &&
                    password === ADMIN_PASSWORD
                ) {


                    /*
                    Login session save karein
                    */

                    sessionStorage.setItem(
                        "dealhub_admin_logged_in",
                        "true"
                    );


                    /*
                    Dashboard par redirect
                    */

                    window.location.href =
                        "admin/dashboard.html";

                }

                else {

                    error.classList.add("show");

                    document
                        .getElementById("password")
                        .value = "";

                }

            });


        /*
        ==========================================
        SHOW / HIDE PASSWORD
        ==========================================
        */

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".show-password");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "Hide";

            }

            else {

                password.type = "password";

                button.textContent = "Show";

            }

        }


        /*
        ==========================================
        IF ALREADY LOGGED IN
        ==========================================
        */

        if (
            sessionStorage.getItem(
                "dealhub_admin_logged_in"
            ) === "true"
        ) {

            window.location.href =
                "admin/dashboard.html";

        }

    </script>


</body>

</html>
