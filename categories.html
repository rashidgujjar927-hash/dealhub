<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Categories - DealHub</title>

    <meta
        name="description"
        content="Browse coupons and deals by category."
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <div class="container nav">


            <!-- LOGO -->

            <a
                href="index.html"
                class="brand"
            >
                Deal<span>Hub</span>
            </a>


            <!-- NAVIGATION -->

            <nav>

                <a href="index.html">
                    Home
                </a>

                <a href="stores.html">
                    Stores
                </a>

                <a href="coupons.html">
                    Coupons
                </a>

                <a
                    href="categories.html"
                    class="active"
                >
                    Categories
                </a>

            </nav>


            <!-- ADMIN -->

            <a
                href="admin/dashboard.html"
                class="admin-link"
            >
                Admin
            </a>


        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="container page">


        <!-- PAGE TITLE -->

        <div class="page-title">

            <div>

                <p class="eyebrow">
                    EXPLORE
                </p>

                <h1>
                    Categories
                </h1>

                <p>
                    Browse the latest coupons and deals
                    by category.
                </p>

            </div>

        </div>



        <!-- ================= SEARCH ================= -->

        <div class="toolbar">

            <input
                type="text"
                id="categorySearch"
                placeholder="Search categories..."
                autocomplete="off"
            >

        </div>



        <!-- ================= CATEGORIES ================= -->

        <div
            id="categoriesList"
            class="category-grid"
        >

            <!-- Categories will be inserted here -->

        </div>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="container footer-inner">

            <strong>
                DealHub
            </strong>

            <span>
                Coupons, Promo Codes & Deals
            </span>

        </div>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <!-- LocalStorage Database -->

    <script src="js/storage.js"></script>


    <!-- Main Website JS -->

    <script src="js/app.js"></script>



    <script>

        /*
         * Escape HTML
         * Prevents HTML injection in category data.
         */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/[&<>"']/g, function (char) {

                    const entities = {

                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#039;"

                    };

                    return entities[char];

                });

        }



        /*
         * Get store count
         */

        function getCategoryStoreCount(categoryId) {

            if (
                typeof DB === "undefined" ||
                typeof DB.stores !== "function"
            ) {

                return 0;

            }


            return DB
                .stores()
                .filter(function (store) {

                    return (
                        store.categoryId === categoryId &&
                        store.status !== "inactive"
                    );

                })
                .length;

        }



        /*
         * Get coupon count
         */

        function getCategoryCouponCount(categoryId) {

            if (
                typeof DB === "undefined" ||
                typeof DB.coupons !== "function"
            ) {

                return 0;

            }


            const stores = DB
                .stores()
                .filter(function (store) {

                    return (
                        store.categoryId === categoryId &&
                        store.status !== "inactive"
                    );

                });


            const storeIds = stores.map(function (store) {

                return store.id;

            });


            return DB
                .coupons()
                .filter(function (coupon) {

                    return (
                        storeIds.includes(coupon.storeId) &&
                        coupon.status !== "inactive"
                    );

                })
                .length;

        }



        /*
         * Render Categories
         */

        function renderCategories() {

            const container =
                document.getElementById("categoriesList");


            if (!container) {

                return;

            }


            if (
                typeof DB === "undefined" ||
                typeof DB.categories !== "function"
            ) {

                container.innerHTML = `
                    <div class="empty">
                        Categories database is not available.
                    </div>
                `;

                return;

            }


            const searchInput =
                document.getElementById("categorySearch");


            const search =
                searchInput
                    ? searchInput.value
                        .trim()
                        .toLowerCase()
                    : "";


            let categories =
                DB.categories()
                    .filter(function (category) {

                        return (
                            category.status !== "inactive"
                        );

                    });


            /*
             * Search
             */

            if (search) {

                categories =
                    categories.filter(function (category) {

                        return (
                            String(category.name || "")
                                .toLowerCase()
                                .includes(search)
                            ||
                            String(category.slug || "")
                                .toLowerCase()
                                .includes(search)
                        );

                    });

            }



            /*
             * Empty state
             */

            if (!categories.length) {

                container.innerHTML = `
                    <div class="empty">

                        <h3>
                            No categories found
                        </h3>

                        <p>
                            Try another search or add
                            categories from the Admin panel.
                        </p>

                    </div>
                `;

                return;

            }



            /*
             * Category Cards
             */

            container.innerHTML =
                categories
                    .map(function (category) {

                        const storeCount =
                            getCategoryStoreCount(
                                category.id
                            );


                        const couponCount =
                            getCategoryCouponCount(
                                category.id
                            );


                        return `

                            <a
                                class="category-card"
                                href="coupons.html?category=${encodeURIComponent(category.id)}"
                            >

                                <div class="category-icon">

                                    ${escapeHTML(
                                        category.icon || "🏷️"
                                    )}

                                </div>


                                <h3>

                                    ${escapeHTML(
                                        category.name
                                    )}

                                </h3>


                                <p class="muted">

                                    ${storeCount}
                                    store${storeCount === 1 ? "" : "s"}

                                    &nbsp; • &nbsp;

                                    ${couponCount}
                                    coupon${couponCount === 1 ? "" : "s"}

                                </p>


                                <span class="category-link">

                                    View deals →

                                </span>

                            </a>

                        `;

                    })
                    .join("");

        }



        /*
         * Search listener
         */

        document
            .getElementById("categorySearch")
            .addEventListener(
                "input",
                renderCategories
            );



        /*
         * Initial render
         */

        renderCategories();

    </script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

</body>

</html>
