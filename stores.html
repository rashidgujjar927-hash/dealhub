<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stores - DealHub</title>

    <meta name="description"
        content="Browse all stores and discover the latest coupons, promo codes and deals.">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <div class="container nav">

            <!-- Logo -->
            <a href="index.html" class="brand">
                Deal<span>Hub</span>
            </a>


            <!-- Navigation -->
            <nav>

                <a href="index.html">
                    Home
                </a>

                <a href="stores.html" class="active">
                    Stores
                </a>

                <a href="coupons.html">
                    Coupons
                </a>

                <a href="categories.html">
                    Categories
                </a>

            </nav>


            <!-- Admin -->
            <a href="admin/dashboard.html" class="admin-link">
                Admin
            </a>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container page">


        <!-- ================= PAGE TITLE ================= -->

        <div class="page-title">

            <div>

                <p class="eyebrow">
                    DIRECTORY
                </p>

                <h1>
                    All Stores
                </h1>

                <p>
                    Browse stores and discover their latest
                    coupons, promo codes and offers.
                </p>

            </div>

        </div>


        <!-- ================= FILTER BAR ================= -->

        <div class="toolbar">

            <!-- Search -->
            <input
                type="search"
                id="storeSearch"
                placeholder="Search stores..."
                autocomplete="off"
            >


            <!-- Category Filter -->
            <select id="storeCategory">

                <option value="">
                    All Categories
                </option>

            </select>

        </div>


        <!-- ================= STORE LIST ================= -->

        <div
            id="storesList"
            class="store-grid">

            <!--
                Stores will be inserted here
                from LocalStorage.
            -->

        </div>


    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="container footer-inner">

            <strong>
                DealHub
            </strong>

            <span>
                Coupons, Promo Codes & Deals
            </span>

        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <!-- LocalStorage Database -->
    <script src="js/storage.js"></script>

    <!-- Frontend Functions -->
    <script src="js/app.js"></script>


    <script>

        /*
         * Initialize category filter
         */

        if (typeof initStoreFilters === "function") {

            initStoreFilters();

        }


        /*
         * Render stores
         */

        if (typeof renderStoresPage === "function") {

            renderStoresPage();

        }


        /*
         * Search Event
         *
         * User type karega to stores
         * automatically filter honge.
         */

        const searchInput =
            document.getElementById("storeSearch");


        searchInput.addEventListener(
            "input",
            function () {

                if (typeof renderStoresPage === "function") {

                    renderStoresPage();

                }

            }
        );


        /*
         * Category Filter Event
         */

        const categorySelect =
            document.getElementById("storeCategory");


        categorySelect.addEventListener(
            "change",
            function () {

                if (typeof renderStoresPage === "function") {

                    renderStoresPage();

                }

            }
        );

    </script>

</body>

</html>
