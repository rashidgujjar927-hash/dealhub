<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coupons - DealHub</title>

    <meta
        name="description"
        content="Find the latest coupons, promo codes, discount codes and deals."
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <div class="container nav">

            <!-- Logo -->
            <a href="index.html" class="brand">
                Deal<span>Hub</span>
            </a>


            <!-- Navigation -->
            <nav>

                <a href="index.html">
                    Home
                </a>

                <a href="stores.html">
                    Stores
                </a>

                <a href="coupons.html" class="active">
                    Coupons
                </a>

                <a href="categories.html">
                    Categories
                </a>

            </nav>


            <!-- Admin -->
            <a
                href="admin/dashboard.html"
                class="admin-link"
            >
                Admin
            </a>

        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="container page">

        <!-- Page Heading -->

        <div class="page-title">

            <div>

                <p class="eyebrow">
                    OFFERS
                </p>

                <h1>
                    All Coupons
                </h1>

                <p>
                    Find promo codes, discount codes and
                    special deals from your favorite stores.
                </p>

            </div>

        </div>



        <!-- ================= FILTERS ================= -->

        <div class="toolbar">

            <!-- Search -->

            <input
                type="text"
                id="couponSearch"
                placeholder="Search coupons..."
                autocomplete="off"
            >


            <!-- Store Filter -->

            <select id="couponStore">

                <option value="">
                    All Stores
                </option>

            </select>


            <!-- Category Filter -->

            <select id="couponCategory">

                <option value="">
                    All Categories
                </option>

            </select>

        </div>



        <!-- ================= COUPONS ================= -->

        <div
            id="couponsList"
            class="coupon-grid"
        >

            <!--
                Coupons will be generated here
                from LocalStorage.
            -->

        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="container footer-inner">

            <strong>
                DealHub
            </strong>

            <span>
                Coupons, Promo Codes & Deals
            </span>

        </div>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <!-- LocalStorage Database -->

    <script src="js/storage.js"></script>


    <!-- Frontend Functions -->

    <script src="js/app.js"></script>


    <script>

        /*
         * Initialize Store & Category Filters
         */

        if (typeof initCouponFilters === "function") {

            initCouponFilters();

        }


        /*
         * Render coupons
         */

        if (typeof renderCouponsPage === "function") {

            renderCouponsPage();

        }



        /*
         * Search while typing
         */

        const searchInput =
            document.getElementById("couponSearch");


        if (searchInput) {

            searchInput.addEventListener(
                "input",
                function () {

                    if (
                        typeof renderCouponsPage ===
                        "function"
                    ) {

                        renderCouponsPage();

                    }

                }
            );

        }



        /*
         * Store filter
         */

        const storeFilter =
            document.getElementById("couponStore");


        if (storeFilter) {

            storeFilter.addEventListener(
                "change",
                function () {

                    if (
                        typeof renderCouponsPage ===
                        "function"
                    ) {

                        renderCouponsPage();

                    }

                }
            );

        }



        /*
         * Category filter
         */

        const categoryFilter =
            document.getElementById("couponCategory");


        if (categoryFilter) {

            categoryFilter.addEventListener(
                "change",
                function () {

                    if (
                        typeof renderCouponsPage ===
                        "function"
                    ) {

                        renderCouponsPage();

                    }

                }
            );

        }

    </script>

</body>
</html>
