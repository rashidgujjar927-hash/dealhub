     JAVASCRIPT

<script src="../js/storage.js"></script>

<script src="../js/admin/dashboard.js"></script>


<script>


/*
=========================================================
LOGIN CONFIGURATION
=========================================================

Demo credentials:

Username:
admin

Password:
Admin@123

Aap baad mein in values ko change kar sakte hain.
=========================================================
*/


const ADMIN_USERNAME = "admin";

const ADMIN_PASSWORD = "Admin@123";



/*
=========================================================
CHECK LOGIN
=========================================================
*/

function checkLogin() {

    const loggedIn =
        sessionStorage.getItem("dealhub_admin_logged_in");

    if (loggedIn === "true") {

        showDashboard();

    } else {

        showLogin();

    }

}



/*
=========================================================
SHOW LOGIN
=========================================================
*/

function showLogin() {

    document.getElementById("loginScreen").style.display =
        "flex";

    document.getElementById("dashboardApp").classList.remove(
        "logged-in"
    );

}



/*
=========================================================
SHOW DASHBOARD
=========================================================
*/

function showDashboard() {

    document.getElementById("loginScreen").style.display =
        "none";

    document.getElementById("dashboardApp").classList.add(
        "logged-in"
    );

}



/*
=========================================================
LOGIN FORM
=========================================================
*/

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;


        const error =
            document.getElementById("loginError");


        /*
         * Check credentials
         */

        if (
            username === ADMIN_USERNAME &&
            password === ADMIN_PASSWORD
        ) {

            /*
             * Save login session
             *
             * sessionStorage use kiya gaya hai,
             * isliye browser/tab close hone ke
             * baad login expire ho jayega.
             */

            sessionStorage.setItem(
                "dealhub_admin_logged_in",
                "true"
            );


            error.classList.remove("show");


            showDashboard();


            /*
             * Dashboard data refresh
             */

            if (typeof dashboard === "function") {

                dashboard();

            }

        } else {

            error.classList.add("show");

        }

    });



/*
=========================================================
LOGOUT
=========================================================
*/

function logout() {

    sessionStorage.removeItem(
        "dealhub_admin_logged_in"
    );


    document.getElementById("loginForm").reset();


    showLogin();

}



/*
=========================================================
RESET DEMO DATA
=========================================================
*/

function seedReset() {

    const confirmed =
        confirm(
            "Reset all data to demo data?"
        );


    if (!confirmed) {

        return;

    }


    localStorage.removeItem(
        DB.key.stores
    );

    localStorage.removeItem(
        DB.key.coupons
    );

    localStorage.removeItem(
        DB.key.categories
    );


    DB.seed();


    if (typeof dashboard === "function") {

        dashboard();

    }

}



/*
=========================================================
INITIAL CHECK
=========================================================
*/

checkLogin();

</script>

</body>
</html>
