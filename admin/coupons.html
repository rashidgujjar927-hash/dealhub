<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coupons - DealHub Admin</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

</head>


<body>


<!-- =====================================================
     ADMIN LAYOUT
===================================================== -->

<div class="admin-layout">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <!-- Logo -->

        <a
            href="dashboard.html"
            class="admin-brand"
        >
            Deal<span>Hub</span>

            <small>
                ADMIN
            </small>
        </a>


        <!-- Navigation -->

        <nav>

            <a href="dashboard.html">
                📊 Dashboard
            </a>

            <a href="stores.html">
                🏪 Stores
            </a>

            <a
                href="coupons.html"
                class="active"
            >
                🎟️ Coupons
            </a>

            <a href="categories.html">
                🏷️ Categories
            </a>

        </nav>


        <!-- Back to website -->

        <a
            href="../index.html"
            class="back"
        >
            ← View Website
        </a>

    </aside>



    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="admin-main">


        <!-- =================================================
             TOP BAR
        ================================================== -->

        <div class="topbar">

            <div>

                <p class="eyebrow">
                    MANAGE
                </p>

                <h1>
                    Coupons
                </h1>

            </div>


            <button
                class="btn-primary"
                type="button"
                onclick="openCouponModal()"
            >
                + Add Coupon
            </button>

        </div>



        <!-- =================================================
             COUPONS PANEL
        ================================================== -->

        <div class="panel">


            <!-- Search -->

            <div class="table-tools">

                <input
                    type="text"
                    id="search"
                    placeholder="Search coupons..."
                    autocomplete="off"
                    oninput="renderTable()"
                >

            </div>



            <!-- Table -->

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Coupon
                            </th>

                            <th>
                                Store
                            </th>

                            <th>
                                Discount
                            </th>

                            <th>
                                Expiry
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="table">

                        <!-- Coupons generated by JavaScript -->

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>



<!-- =====================================================
     ADD / EDIT COUPON MODAL
===================================================== -->

<div
    id="modal"
    class="modal"
>


    <div class="modal-box">


        <!-- Modal Header -->

        <div class="modal-head">

            <h2 id="modalTitle">
                Add Coupon
            </h2>


            <button
                type="button"
                onclick="closeModal()"
                aria-label="Close"
            >
                ×
            </button>

        </div>



        <!-- =================================================
             FORM
        ================================================== -->

        <form id="form">


            <!-- Hidden ID -->

            <input
                type="hidden"
                id="id"
            >



            <!-- Coupon Title -->

            <label>

                Coupon Title

                <input
                    class="form-control"
                    type="text"
                    id="title"
                    placeholder="Example: 20% Off Selected Items"
                    required
                >

            </label>



            <!-- Store -->

            <label>

                Store

                <select
                    class="form-control"
                    id="store"
                    required
                >

                    <option value="">
                        Select Store
                    </option>

                </select>

            </label>



            <!-- Coupon Code -->

            <label>

                Coupon Code

                <input
                    class="form-control"
                    type="text"
                    id="code"
                    placeholder="Example: SAVE20"
                >

            </label>



            <!-- Discount -->

            <label>

                Discount

                <input
                    class="form-control"
                    type="text"
                    id="discount"
                    placeholder="Example: 20%"
                >

            </label>



            <!-- Description -->

            <label>

                Description

                <textarea
                    class="form-control"
                    id="description"
                    placeholder="Describe this coupon or deal..."
                ></textarea>

            </label>



            <!-- Expiry -->

            <label>

                Expiry Date

                <input
                    class="form-control"
                    type="date"
                    id="expiry"
                >

            </label>



            <!-- Coupon Type -->

            <label>

                Coupon Type

                <select
                    class="form-control"
                    id="type"
                >

                    <option value="code">
                        Coupon Code
                    </option>

                    <option value="deal">
                        Deal
                    </option>

                </select>

            </label>



            <!-- Status -->

            <label>

                Status

                <select
                    class="form-control"
                    id="status"
                >

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                </select>

            </label>



            <!-- Submit -->

            <button
                class="btn-primary"
                type="submit"
            >
                Save Coupon
            </button>


        </form>

    </div>

</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<!-- LocalStorage Database -->

<script src="../js/storage.js"></script>

    <script>
const DB = {
    coupons: function () {
        try {
            return JSON.parse(
                localStorage.getItem("dealhub_coupons")
            ) || [];
        } catch (e) {
            return [];
        }
    },

    saveCoupons: function (data) {
        localStorage.setItem(
            "dealhub_coupons",
            JSON.stringify(data)
        );
        return data;
    },

    stores: function () {
        try {
            return JSON.parse(
                localStorage.getItem("dealhub_stores")
            ) || [];
        } catch (e) {
            return [];
        }
    },

    categories: function () {
        try {
            return JSON.parse(
                localStorage.getItem("dealhub_categories")
            ) || [];
        } catch (e) {
            return [];
        }
    }
};
</script>

<!-- Coupon Admin Logic -->

<script src="../js/admin/coupons.js"></script>


</body>
</html>
