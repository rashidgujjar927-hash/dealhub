<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - Admin</title>

  <link rel="stylesheet" href="../css/admin.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .admin-layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: #111827;
      color: white;
      padding: 25px 15px;
      flex-shrink: 0;
    }

    .admin-brand {
      font-size: 24px;
      font-weight: 700;
      padding: 0 10px 30px;
    }

    .sidebar nav a {
      display: block;
      color: #d1d5db;
      text-decoration: none;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 5px;
    }

    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: #2563eb;
      color: white;
    }

    .admin-main {
      flex: 1;
      padding: 30px;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 28px;
    }

    .muted {
      color: #6b7280;
    }

    .btn-primary {
      border: 0;
      background: #2563eb;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 19px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #edf0f5;
      text-align: left;
      white-space: nowrap;
    }

    th {
      font-size: 13px;
      color: #6b7280;
      background: #f9fafb;
    }

    .category-name {
      font-weight: 600;
    }

    .category-icon-small {
      font-size: 24px;
      margin-right: 8px;
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .active-badge {
      background: #dcfce7;
      color: #166534;
    }

    .inactive-badge {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .actions button {
      border: 1px solid #d1d5db;
      background: white;
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    .actions button:hover {
      background: #f3f4f6;
    }

    .actions .danger {
      color: #dc2626;
      border-color: #fecaca;
    }

    .actions .danger:hover {
      background: #fef2f2;
    }

    .empty-state {
      text-align: center;
      padding: 45px 20px;
      color: #6b7280;
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    /* Modal */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 21px;
    }

    .close-btn {
      border: 0;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
      color: #6b7280;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    .field-help {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: #6b7280;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    .btn-secondary {
      border: 1px solid #d1d5db;
      background: white;
      color: #374151;
      padding: 10px 17px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #f3f4f6;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 190px;
      }

      .admin-main {
        padding: 20px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 600px) {
      .admin-layout {
        display: block;
      }

      .sidebar {
        width: 100%;
      }

      .sidebar nav {
        display: flex;
        overflow-x: auto;
        gap: 5px;
      }

      .sidebar nav a {
        white-space: nowrap;
      }

      .admin-main {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="admin-brand">
      DealHub
    </div>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="stores.html">Stores</a>
      <a href="coupons.html">Coupons</a>
      <a href="categories.html" class="active">Categories</a>
    </nav>

  </aside>


  <!-- MAIN -->
  <main class="admin-main">

    <div class="topbar">

      <div>
        <h1>Categories</h1>
        <p class="muted">Manage your website categories</p>
      </div>

      <button
        type="button"
        class="btn-primary"
        onclick="openCategoryModal()"
      >
        + Add Category
      </button>

    </div>


    <div class="panel">

      <div class="panel-head">
        <h2>All Categories</h2>
        <span id="categoryCount" class="muted"></span>
      </div>


      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Category</th>
              <th>Slug</th>
              <th>Stores</th>
              <th>Coupons</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="categoriesTable">
          </tbody>

        </table>

      </div>

    </div>

  </main>

</div>


<!-- ADD / EDIT MODAL -->

<div class="modal" id="categoryModal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">Add Category</h2>

      <button
        type="button"
        class="close-btn"
        onclick="closeCategoryModal()"
      >
        &times;
      </button>

    </div>


    <form id="categoryForm">

      <input
        type="hidden"
        id="categoryId"
      >


      <div class="form-group">

        <label for="categoryName">
          Category Name
        </label>

        <input
          type="text"
          id="categoryName"
          class="form-control"
          placeholder="e.g. Fashion"
          required
        >

      </div>


      <div class="form-group">

        <label for="categorySlug">
          Slug
        </label>

        <input
          type="text"
          id="categorySlug"
          class="form-control"
          placeholder="e.g. fashion"
        >

        <span class="field-help">
          Leave empty to generate automatically.
        </span>

      </div>


      <div class="form-group">

        <label for="categoryIcon">
          Icon / Emoji
        </label>

        <input
          type="text"
          id="categoryIcon"
          class="form-control"
          placeholder="👕"
        >

      </div>


      <div class="form-group">

        <label for="categoryStatus">
          Status
        </label>

        <select
          id="categoryStatus"
          class="form-control"
        >
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>

      </div>


      <div class="form-actions">

        <button
          type="button"
          class="btn-secondary"
          onclick="closeCategoryModal()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn-primary"
        >
          Save Category
        </button>

      </div>

    </form>

  </div>

</div>


<!-- DATABASE -->

<script src="../js/storage.js"></script>

  <script>
const DB = {
    categories: function () {
        try {
            return JSON.parse(
                localStorage.getItem("dealhub_categories")
            ) || [];
        } catch (e) {
            return [];
        }
    },

    saveCategories: function (data) {
        localStorage.setItem(
            "dealhub_categories",
            JSON.stringify(data)
        );
        return data;
    },

    stores: function () {
        try {
            return JSON.parse(
                localStorage.getItem("dealhub_stores")
            ) || [];
        } catch (e) {
            return [];
        }
    },

    coupons: function () {
        try {
            return JSON.parse(
                localStorage.getItem("dealhub_coupons")
            ) || [];
        } catch (e) {
            return [];
        }
    }
};
</script>


<!-- CATEGORY SCRIPT -->

<script>

  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHTML(value) {

    return String(value ?? "").replace(
      /[&<>"']/g,
      function (char) {

        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return map[char];

      }
    );

  }


  /* =========================
     GET CATEGORIES
  ========================= */

  function getCategories() {

    return DB.categories();

  }


  /* =========================
     GENERATE SLUG
  ========================= */

  function generateSlug(text) {

    return String(text || "")
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");

  }


  /* =========================
     RENDER CATEGORIES
  ========================= */

  function renderCategories() {

    const table =
      document.getElementById("categoriesTable");

    const count =
      document.getElementById("categoryCount");

    const categories = getCategories();

    const stores = DB.stores();

    const coupons = DB.coupons();


    count.textContent =
      categories.length +
      (categories.length === 1 ? " category" : " categories");


    if (!categories.length) {

      table.innerHTML = `
        <tr>
          <td colspan="6">
            <div class="empty-state">
              <div class="empty-icon">📂</div>
              <div>No categories found.</div>
            </div>
          </td>
        </tr>
      `;

      return;

    }


    table.innerHTML = categories.map(function(category) {

      const storeCount =
        stores.filter(function(store) {
          return store.categoryId === category.id;
        }).length;


      const categoryStoreIds =
        stores
          .filter(function(store) {
            return store.categoryId === category.id;
          })
          .map(function(store) {
            return store.id;
          });


      const couponCount =
        coupons.filter(function(coupon) {
          return categoryStoreIds.includes(coupon.storeId);
        }).length;


      const statusClass =
        category.status === "active"
          ? "active-badge"
          : "inactive-badge";


      return `
        <tr>

          <td>

            <span class="category-icon-small">
              ${escapeHTML(category.icon || "📁")}
            </span>

            <span class="category-name">
              ${escapeHTML(category.name)}
            </span>

          </td>

          <td>
            ${escapeHTML(category.slug)}
          </td>

          <td>
            ${storeCount}
          </td>

          <td>
            ${couponCount}
          </td>

          <td>

            <span class="badge ${statusClass}">
              ${escapeHTML(category.status || "active")}
            </span>

          </td>

          <td>

            <div class="actions">

              <button
                type="button"
                onclick="editCategory('${escapeHTML(category.id)}')"
              >
                Edit
              </button>

              <button
                type="button"
                class="danger"
                onclick="deleteCategory('${escapeHTML(category.id)}')"
              >
                Delete
              </button>

            </div>

          </td>

        </tr>
      `;

    }).join("");

  }


  /* =========================
     OPEN MODAL
  ========================= */

  function openCategoryModal(id) {

    const modal =
      document.getElementById("categoryModal");

    const form =
      document.getElementById("categoryForm");


    form.reset();


    document.getElementById("categoryId").value = "";


    document.getElementById("modalTitle").textContent =
      id ? "Edit Category" : "Add Category";


    if (id) {

      const category =
        getCategories().find(function(item) {
          return item.id === id;
        });


      if (!category) {

        alert("Category not found.");

        return;

      }


      document.getElementById("categoryId").value =
        category.id;

      document.getElementById("categoryName").value =
        category.name || "";

      document.getElementById("categorySlug").value =
        category.slug || "";

      document.getElementById("categoryIcon").value =
        category.icon || "";

      document.getElementById("categoryStatus").value =
        category.status || "active";

    }


    modal.classList.add("show");

  }


  /* =========================
     EDIT
  ========================= */

  function editCategory(id) {

    openCategoryModal(id);

  }


  /* =========================
     CLOSE MODAL
  ========================= */

  function closeCategoryModal() {

    document
      .getElementById("categoryModal")
      .classList.remove("show");

  }


  /* =========================
     SAVE CATEGORY
  ========================= */

  document
    .getElementById("categoryForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();


      const id =
        document
          .getElementById("categoryId")
          .value
          .trim();


      const name =
        document
          .getElementById("categoryName")
          .value
          .trim();


      let slug =
        document
          .getElementById("categorySlug")
          .value
          .trim();


      const icon =
        document
          .getElementById("categoryIcon")
          .value
          .trim();


      const status =
        document
          .getElementById("categoryStatus")
          .value;


      /* NAME REQUIRED */

      if (!name) {

        alert("Please enter category name.");

        return;

      }


      /* AUTO SLUG */

      if (!slug) {

        slug = generateSlug(name);

      } else {

        slug = generateSlug(slug);

      }


      if (!slug) {

        alert("Please enter a valid category name.");

        return;

      }


      let categories = getCategories();


      /* DUPLICATE SLUG CHECK */

      const duplicate =
        categories.find(function(category) {

          return (
            category.slug === slug &&
            category.id !== id
          );

        });


      if (duplicate) {

        alert(
          "This category slug already exists. Please use another slug."
        );

        return;

      }


      /* CATEGORY OBJECT */

      const category = {

        id: id || "cat_" + Date.now(),

        name: name,

        slug: slug,

        icon: icon || "📁",

        status: status || "active"

      };


      /* UPDATE OR ADD */

      const existingIndex =
        categories.findIndex(function(item) {

          return item.id === category.id;

        });


      if (existingIndex >= 0) {

        categories[existingIndex] = category;

      } else {

        categories.push(category);

      }


      /* SAVE TO LOCAL STORAGE */

      DB.saveCategories(categories);


      /* CLOSE */

      closeCategoryModal();


      /* REFRESH TABLE */

      renderCategories();


      /* SUCCESS */

      alert(
        existingIndex >= 0
          ? "Category updated successfully!"
          : "Category added successfully!"
      );

    });


  /* =========================
     DELETE CATEGORY
  ========================= */

  function deleteCategory(id) {

    const categories = getCategories();

    const category =
      categories.find(function(item) {
        return item.id === id;
      });


    if (!category) {

      alert("Category not found.");

      return;

    }


    const stores =
      DB.stores().filter(function(store) {
        return store.categoryId === id;
      });


    if (stores.length > 0) {

      alert(
        "You cannot delete this category because " +
        stores.length +
        " store(s) are using it. Please change or delete those stores first."
      );

      return;

    }


    const confirmed =
      confirm(
        'Delete category "' +
        category.name +
        '"?'
      );


    if (!confirmed) {

      return;

    }


    const updatedCategories =
      categories.filter(function(item) {

        return item.id !== id;

      });


    DB.saveCategories(updatedCategories);


    renderCategories();


    alert("Category deleted successfully!");

  }


  /* =========================
     CLOSE WHEN CLICK OUTSIDE
  ========================= */

  document
    .getElementById("categoryModal")
    .addEventListener("click", function(event) {

      if (event.target === this) {

        closeCategoryModal();

      }

    });


  /* =========================
     INITIAL LOAD
  ========================= */

  renderCategories();

</script>

</body>
</html>
